<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D Business Manager</title>
<style>
:root{
  --bg:#0F1115; --panel:#171A21; --panel2:#1E2229; --border:#2A2F3A;
  --text:#EDEFF3; --muted:#9AA3B2; --accent:#4F8CFF; --accent2:#22C58B;
  --warn:#F5A623; --danger:#F0546A; --radius:14px;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media(prefers-color-scheme:light){
  :root:not([data-theme="dark"]){--bg:#F6F7FB;--panel:#FFFFFF;--panel2:#F0F2F7;--border:#E3E6EE;--text:#171A21;--muted:#6B7280;}
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button,input,select{font-family:inherit;color:inherit}
.app{display:flex;min-height:100%}
.sidebar{width:230px;background:var(--panel);border-right:1px solid var(--border);padding:16px 10px;display:flex;flex-direction:column;gap:2px;flex-shrink:0}
.brand{font-weight:700;font-size:17px;padding:8px 10px 18px}
.brand span{color:var(--accent)}
.navbtn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:none;background:transparent;color:var(--muted);text-align:left;cursor:pointer;font-size:14px;transition:background .12s ease}
.navbtn.active{background:var(--accent);color:#fff}
.navbtn:hover:not(.active){background:var(--panel2);color:var(--text)}
.main{flex:1;min-width:0;padding:22px 26px 60px;overflow-x:hidden}
.panel,.card{transition:box-shadow .15s ease}
input,select{transition:border-color .12s ease}
input:focus,select:focus{outline:none;border-color:var(--accent)}
.main.routefade{animation:fadein .18s ease}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:22px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.kpi .label{color:var(--muted);font-size:12px;margin-bottom:6px}
.kpi .val{font-size:22px;font-weight:700}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:18px}
.panel h2{font-size:15px;margin:0 0 14px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.row{display:flex;gap:10px;flex-wrap:wrap}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
input,select{width:100%;padding:9px 10px;background:var(--panel2);border:1px solid var(--border);border-radius:8px;font-size:14px}
.field{flex:1;min-width:130px;margin-bottom:12px}
.btn{padding:9px 16px;border-radius:9px;border:none;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;font-size:14px;transition:transform .08s ease, opacity .15s ease}
.btn:active{transform:scale(0.97)}
.btn:disabled{opacity:.6;cursor:default;transform:none}
.btn.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--border)}
.btn.small{padding:6px 10px;font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--border)}
th{color:var(--muted);font-weight:600;font-size:12px}
.swatchgrid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.swatch{display:flex;align-items:center;gap:8px;padding:7px 12px 7px 7px;border-radius:999px;border:2px solid var(--border);cursor:pointer;background:var(--panel2)}
.swatch.sel{border-color:var(--accent)}
.dot{width:20px;height:20px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
.calcline{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px}
.calcline.total{font-weight:700;font-size:17px;border-bottom:none;padding-top:12px}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;background:var(--panel2);border:1px solid var(--border)}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.mobnav{display:none}
@media(max-width:820px){
  .sidebar{display:none}
  .mobnav{display:flex;position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--border);padding:6px calc(env(safe-area-inset-bottom,0px)+6px) calc(6px + env(safe-area-inset-bottom,0px));gap:2px;overflow-x:auto}
  .main{padding:16px 14px 90px}
  .app{flex-direction:column}
}
::-webkit-scrollbar{height:8px;width:8px}

<script>

const SUPABASE_URL = "https://anxbmkmfqflgofxjbzvz.supabase.co";
const SUPABASE_KEY = "sb_publishable_zrkctlKMsPhPmTMXrP6yBg_7c_KvLOY";
const CONFIG_COLLECTION = "3dbm_config";
let supa = null, userId = null, configRowId = null, connError = null;

function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4); }
function today(){ return new Date().toISOString().slice(0,10); }
function money(n){ n = isFinite(n)?n:0; return "$"+n.toLocaleString("es-MX",{minimumFractionDigits:2,maximumFractionDigits:2}); }

function defaultConfig(){
  return {
    settings: {
      business:{name:"Mi Negocio 3D", whatsapp:"", phone:"", email:""},

let DB = { settings:defaultConfig().settings, printers:[{wattage:0,hoursUsed:0,purchasePrice:0,residualValue:0,lifeHours:1,brand:"",model:""}],
  electricity:{ratePerKwh:0}, categories:[], seasons:[], filaments:[], products:[], packages:[], customers:[],
  sales:[], quotes:[], purchases:[], expenses:[], maintenance:[], inventoryMovements:[], printJobs:[] };

/* Genérico: cada "colección" (filaments, products, sales, etc.) vive en la tabla app_records,
   una fila por registro, con todo el objeto en la columna jsonb "payload". */
async function sbList(collection){
  const {data,error} = await supa.from("app_records").select("id,payload,created_at").eq("collection",collection).order("created_at");
  if(error) throw error;
  return data.map(r=>({...r.payload, id:r.id}));
}
async function sbAdd(collection, obj){
  const clean = {...obj}; delete clean.id;
  const {data,error} = await supa.from("app_records").insert({collection, payload:clean, user_id:userId}).select("id").single();
  if(error) throw error;
  return {...clean, id:data.id};
}
async function sbUpdate(collection, id, patch){
  const {data:cur,error:e1} = await supa.from("app_records").select("payload").eq("id",id).single();
  if(e1) throw e1;
  const merged = {...cur.payload, ...patch};
  const {error:e2} = await supa.from("app_records").update({payload:merged}).eq("id",id);
  if(e2) throw e2;
  return {...merged, id};
}
async function sbDelete(collection, id){
  const {error} = await supa.from("app_records").delete().eq("id",id);
  if(error) throw error;
}
async function sbLoadConfig(){
  const {data,error} = await supa.from("app_records").select("id,payload").eq("collection",CONFIG_COLLECTION).limit(1);
  if(error) throw error;
  if(data && data.length){ configRowId = data[0].id; return data[0].payload; }
  const created = await sbAdd(CONFIG_COLLECTION, defaultConfig());
  configRowId = created.id;
  const { id, ...cfg } = created;
  return cfg;
}
async function saveConfig(patch){
  const merged = await sbUpdate(CONFIG_COLLECTION, configRowId, patch);
  Object.assign(DB.settings? {} : {}, {});
  DB.settings = merged.settings; DB.printers = merged.printers; DB.electricity = merged.electricity;
  DB.categories = merged.categories; DB.seasons = merged.seasons;
}

async function loadAllData(){
  const cfg = await sbLoadConfig();
  DB.settings = cfg.settings; DB.printers = cfg.printers; DB.electricity = cfg.electricity;
  DB.categories = cfg.categories; DB.seasons = cfg.seasons;
  const [filaments, products, packages, customers, sales, quotes, purchases, expenses, maintenance, inventoryMovements, printJobs] = await Promise.all([
    sbList("filaments"), sbList("products"), sbList("packages"), sbList("customers"), sbList("sales"),
    sbList("quotes"), sbList("purchases"), sbList("expenses"), sbList("maintenance"), sbList("inventoryMovements"), sbList("printJobs")
  ]);
  Object.assign(DB, {filaments, products, packages, customers, sales, quotes, purchases, expenses, maintenance, inventoryMovements, printJobs});
}

let authMode = "login"; // "login" | "signup"
let authError = "";

function viewAuth(){
  return `<div style="max-width:360px;margin:10vh auto;padding:0 16px">
    <div class="brand" style="padding:0 0 20px;text-align:center;font-size:22px">3D <span>Business</span></div>
    <div class="panel">
      <h2>${authMode==="login"?"Iniciar sesión":"Crear cuenta"}</h2>
      ${authError?`<div class="hint" style="color:var(--danger);margin-bottom:10px">${authError}</div>`:''}
      <div class="field"><label>Correo</label><input id="authEmail" type="email" autocomplete="username"></div>
      <div class="field"><label>Contraseña</label><input id="authPass" type="password" autocomplete="current-password"></div>
      <button class="btn" style="width:100%;margin-bottom:10px" id="authSubmitBtn" onclick="submitAuth()">${authMode==="login"?"Entrar":"Registrarme"}</button>
      <div class="hint" style="text-align:center;cursor:pointer" onclick="authMode=authMode==='login'?'signup':'login';authError='';render()">
        ${authMode==="login"?"¿No tienes cuenta? Regístrate":"¿Ya tienes cuenta? Inicia sesión"}
      </div>
    </div>
    <div class="hint" style="text-align:center">Con una cuenta real, tus datos se ven igual en cualquier navegador o dispositivo donde inicies sesión.</div>
  </div>`;
}
async function submitAuth(){
  const email = document.getElementById("authEmail").value.trim();
  const pass = document.getElementById("authPass").value;
  if(!email || !pass){ authError="Falta correo o contraseña."; render(); return; }
  const btn = document.getElementById("authSubmitBtn"); btn.disabled=true; btn.textContent="Un momento…";
  try{
    if(authMode==="login"){
      const {error} = await supa.auth.signInWithPassword({email, password:pass});
      if(error) throw error;
    } else {
      const {error} = await supa.auth.signUp({email, password:pass});
      if(error) throw error;
      alert("Cuenta creada. Si tu proyecto pide confirmar por correo, revisa tu bandeja antes de entrar.");
    }
    authError = "";
    await startSession();
  }catch(err){
    authError = err.message || String(err);
    render();
  }
}
let realtimeChannel = null, remoteRefreshTimer = null;
function subscribeRealtime(){
  if(realtimeChannel){ supa.removeChannel(realtimeChannel); realtimeChannel=null; }
  realtimeChannel = supa.channel("app_records_changes_"+userId)
    .on("postgres_changes", {event:"*", schema:"public", table:"app_records", filter:`user_id=eq.${userId}`}, ()=>{
      scheduleRemoteRefresh();
    })
    .subscribe();
}
function scheduleRemoteRefresh(){
  clearTimeout(remoteRefreshTimer);
  remoteRefreshTimer = setTimeout(async ()=>{
    try{ await loadAllData(); connError = null; }
    catch(err){ connError = err.message || String(err); }
    render();
  }, 400);
}
async function logout(){
  if(realtimeChannel){ supa.removeChannel(realtimeChannel); realtimeChannel=null; }
  await supa.auth.signOut();
  Object.assign(DB, {filaments:[],products:[],packages:[],customers:[],sales:[],quotes:[],purchases:[],expenses:[],maintenance:[],inventoryMovements:[],printJobs:[]});
  userId = null; currentRoute="dashboard";
  render();
}

async function startSession(){
  const { data:{ user } } = await supa.auth.getUser();
  userId = user.id;
  try{
    await loadAllData();
    connError = null;
    subscribeRealtime();
  }catch(err){
    connError = err.message || String(err);
    console.error("Error cargando datos:", err);
  }
  render();
}

async function initApp(){
  supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const { data:{ session } } = await supa.auth.getSession();
  if(session && session.user && !session.user.is_anonymous){
    await startSession();
  } else {
    userId = null;
    render();
  }
}

const repo = {
  filaments:{
    async add(f){ f.createdAt=today(); const saved=await sbAdd("filaments",f); DB.filaments.push(saved); },
    async remove(id){ await sbDelete("filaments",id); DB.filaments = DB.filaments.filter(f=>f.id!==id); }
  },
  products:{
    async add(p){ p.createdAt=today(); const saved=await sbAdd("products",p); DB.products.push(saved); },
    async remove(id){ await sbDelete("products",id); DB.products = DB.products.filter(x=>x.id!==id); }
  },
  customers:{
    async add(c){ c.createdAt=today(); const saved=await sbAdd("customers",c); DB.customers.push(saved); },
    async remove(id){ await sbDelete("customers",id); DB.customers = DB.customers.filter(x=>x.id!==id); }
  },
  sales:{
    async add(s){
      s.payments=[]; s.status="Pendiente";
      const saved = await sbAdd("sales", s); DB.sales.push(saved);
      const prod = DB.products.find(p=>p.id===s.productId);
      if(prod){
        const before = prod.stock; const after = Math.max(prod.stock - s.qty, 0);
        await repo.products_setStock(prod.id, after);
        const mv = await sbAdd("inventoryMovements", {date:today(), productId:prod.id, productName:prod.name,
          type:"Salida", qty:s.qty, reason:"Venta", stockBefore:before, stockAfter:after});
        DB.inventoryMovements.push(mv);
      }
    },
    async remove(id){ await sbDelete("sales",id); DB.sales = DB.sales.filter(x=>x.id!==id); },
    async addPayment(saleId, amount, method, note){
      const s = DB.sales.find(x=>x.id===saleId); if(!s) return;
      const paid = s.payments.reduce((a,p)=>a+p.amount,0);
      if(paid + amount > s.total + 0.001){ alert("El pago excede el saldo pendiente."); return; }
      const payments = [...s.payments, {id:uid(), date:today(), amount, method, note}];
      const status = (paid+amount >= s.total - 0.001) ? "Entregado" : s.status;
      const saved = await sbUpdate("sales", saleId, {payments, status});
      Object.assign(s, saved);
    }
  },
  async products_setStock(productId, stock){
    const prod = DB.products.find(p=>p.id===productId); if(!prod) return;
    const saved = await sbUpdate("products", productId, {stock}); Object.assign(prod, saved);
  },
  inventory:{
    async adjust(productId, qty, reason){
      const prod = DB.products.find(p=>p.id===productId); if(!prod) return;
      const before = prod.stock; const after = Math.max(prod.stock + qty, 0);
      await repo.products_setStock(productId, after);
      const mv = await sbAdd("inventoryMovements", {date:today(), productId:prod.id, productName:prod.name,
        type: qty>=0?"Entrada":"Salida", qty:Math.abs(qty), reason: reason||"Ajuste manual", stockBefore:before, stockAfter:after});
      DB.inventoryMovements.push(mv);
    }
  },
  printJobs:{
    async add(job){
      const p = DB.printers[0], e = DB.electricity, s = DB.settings;
      const kwh = (p.wattage * job.hours)/1000;
      const elecCost = kwh * e.ratePerKwh;
      const depPerHour = s.depreciationEnabled ? (p.purchasePrice - p.residualValue)/p.lifeHours : 0;
      const depCost = depPerHour * job.hours;
      job.printerId = p.id; job.printerName = p.brand+" "+p.model;
      job.ratePerKwhUsed = e.ratePerKwh; job.wattageUsed = p.wattage;
      job.electricityCost = elecCost; job.depreciationCost = depCost; job.totalCost = elecCost + depCost;
      const saved = await sbAdd("printJobs", job); DB.printJobs.push(saved);
      p.hoursUsed = (p.hoursUsed||0) + job.hours;
      await saveConfig({printers: DB.printers});
    },
    async remove(id){ await sbDelete("printJobs",id); DB.printJobs = DB.printJobs.filter(x=>x.id!==id); }
  },
  expenses:{
    async add(e){ e.createdAt=today(); const saved=await sbAdd("expenses",e); DB.expenses.push(saved); },
    async remove(id){ await sbDelete("expenses",id); DB.expenses = DB.expenses.filter(x=>x.id!==id); }
  },
  packages:{
    async add(p){ p.createdAt=today(); const saved=await sbAdd("packages",p); DB.packages.push(saved); },
    async remove(id){ await sbDelete("packages",id); DB.packages = DB.packages.filter(x=>x.id!==id); }
  },
  purchases:{
    async add(p){ p.createdAt=today(); p.status="Pendiente"; const saved=await sbAdd("purchases",p); DB.purchases.push(saved); },
    async remove(id){ await sbDelete("purchases",id); DB.purchases = DB.purchases.filter(x=>x.id!==id); },
    async setStatus(id, status){ const saved = await sbUpdate("purchases", id, {status}); const p=DB.purchases.find(x=>x.id===id); if(p) Object.assign(p, saved); }
  },
  maintenance:{
    async add(m){ const saved=await sbAdd("maintenance",m); DB.maintenance.push(saved); },
    async remove(id){ await sbDelete("maintenance",id); DB.maintenance = DB.maintenance.filter(x=>x.id!==id); }
  },
  quotes:{
    async add(q){ q.createdAt=today(); q.status="Vigente"; const saved=await sbAdd("quotes",q); DB.quotes.push(saved); },
    async remove(id){ await sbDelete("quotes",id); DB.quotes = DB.quotes.filter(x=>x.id!==id); },
    async convertToSale(id){
      const q = DB.quotes.find(x=>x.id===id); if(!q) return;
      const prod = DB.products.find(p=>p.id===q.productId);
      await repo.sales.add({customerId:q.customerId, productId:q.productId, productName:prod?prod.name:q.productId,
        qty:q.qty, discount:q.discount, total:q.total, cost:(prod?prod.cost:0)*q.qty, profit:q.total-(prod?prod.cost:0)*q.qty});
      const saved = await sbUpdate("quotes", id, {status:"Convertida"}); Object.assign(q, saved);
    }
  }
};

let currentRoute = "dashboard";

function renderNav(){
  const side = document.getElementById("sidebar");
  const mob = document.getElementById("mobnav");
  if(!userId){ side.innerHTML=""; mob.innerHTML=""; return; }
  side.innerHTML = `<div class="brand">3D <span>Business</span></div>` +
    ROUTES.map(r=>`<button class="navbtn ${r.id===currentRoute?'active':''}" onclick="go('${r.id}')">${r.icon} &nbsp;${r.label}</button>`).join("") +
    `<button class="navbtn" style="margin-top:auto;color:var(--danger)" onclick="logout()">⏻ &nbsp;Cerrar sesión</button>`;
  mob.innerHTML = ROUTES.map(r=>`<button class="navbtn small ${r.id===currentRoute?'active':''}" style="flex:1;flex-direction:column;font-size:10px;padding:8px 2px" onclick="go('${r.id}')">${r.icon}<br>${r.label}</button>`).join("");
}
function go(id){
  currentRoute=id;
  const main = document.getElementById("main");
  main.classList.remove("routefade"); void main.offsetWidth; main.classList.add("routefade");
  render();
}

/* ============ DASHBOARD ============ */
function viewDashboard(){
  const thisMonth = today().slice(0,7);
  const monthSales = DB.sales.filter(s=>s.createdAt.slice(0,7)===thisMonth);
  const ventas = monthSales.reduce((a,s)=>a+s.total,0);
  const cobrado = monthSales.reduce((a,s)=>a+s.payments.reduce((x,p)=>x+p.amount,0),0);
  const pendiente = ventas - cobrado;
  const costos = monthSales.reduce((a,s)=>a+s.cost,0) + DB.expenses.filter(e=>e.date.slice(0,7)===thisMonth).reduce((a,e)=>a+e.amount,0);
  const ganancia = ventas - costos;
  const monthJobs = DB.printJobs.filter(j=>j.date.slice(0,7)===thisMonth);
  const kpis = [
    ["Ventas del mes", money(ventas)], ["Cobrado", money(cobrado)], ["Pendiente", money(pendiente)],

    ["Filamento usado (mes)", monthJobs.reduce((a,j)=>a+j.grams,0)+" g"]
  ];
  return `

  <div class="sub">Resumen del mes actual (${thisMonth}).</div>
  <div class="grid">${kpis.map(k=>`<div class="card kpi"><div class="label">${k[0]}</div><div class="val">${k[1]}</div></div>`).join("")}</div>

      const cust = DB.customers.find(c=>c.id===s.customerId);
      const pend = s.total - s.payments.reduce((a,p)=>a+p.amount,0);
      return `<div class="calcline"><span>${cust?cust.name:'—'} — ${s.productName}</span><span>${money(pend)}</span></div>`;
    }).join("") || '<div class="hint">No hay saldos pendientes.</div>'}
  </div>
  <div class="panel">
    <h2>Alertas de filamento bajo</h2>
    ${DB.filaments.filter(f=>f.gramsAvailable<=f.minStock).map(f=>`<div class="calcline"><span>${f.colorName} — ${f.brand} ${f.type}</span><span>${f.gramsAvailable} g</span></div>`).join("") || '<div class="hint">Todo el stock está por encima del mínimo.</div>'}

/* ============ FIJADOR DE PRECIOS ============ */
let pricerState = { filamentId:null, grams:0, hours:0, pieces:1, otherCosts:0, margin: DB.settings.margin };
function viewPricer(){
  const fils = DB.filaments;
  const s = DB.settings, e = DB.electricity, p = DB.printers[0];
  return `<h1>Fijador de precios</h1><div class="sub">Calcula el costo real y el precio sugerido de un producto.</div>
  <div class="panel"><h2>Datos de impresión</h2>
  <div class="row">
    <div class="field"><label>Filamento</label><select id="pxFil" onchange="pricerState.filamentId=this.value;render()">
      <option value="">Selecciona…</option>
      ${fils.map(f=>`<option value="${f.id}" ${pricerState.filamentId===f.id?'selected':''}>${f.colorName} — ${f.brand} ${f.type} (${money(f.pricePerGram)}/g)</option>`).join("")}
    </select></div>
    <div class="field"><label>Gramos usados</label><input id="pxGrams" type="number" value="${pricerState.grams}" oninput="pricerState.grams=parseFloat(this.value)||0;render()"></div>
    <div class="field"><label>Horas de impresión</label><input id="pxHours" type="number" step="0.1" value="${pricerState.hours}" oninput="pricerState.hours=parseFloat(this.value)||0;render()"></div>
    <div class="field"><label>Piezas</label><input id="pxPieces" type="number" value="${pricerState.pieces}" oninput="pricerState.pieces=parseFloat(this.value)||1;render()"></div>
    <div class="field"><label>Otros costos (empaque, etc.)</label><input id="pxOther" type="number" value="${pricerState.otherCosts}" oninput="pricerState.otherCosts=parseFloat(this.value)||0;render()"></div>
    <div class="field"><label>Margen (%)</label><input id="pxMargin" type="number" value="${pricerState.margin}" oninput="pricerState.margin=parseFloat(this.value)||0;render()"></div>
  </div></div>
  ${renderPricerResult(fils,s,e,p)}
  `;
}
function renderPricerResult(fils,s,e,p){
  const fil = fils.find(f=>f.id===pricerState.filamentId);
  if(!fil) return `<div class="panel"><div class="hint">Selecciona un filamento y llena los datos para ver el cálculo.</div></div>`;
  const wasteMult = 1 + (s.wastePercent/100);
  const filCost = fil.pricePerGram * pricerState.grams * wasteMult;
  const kwh = (p.wattage * pricerState.hours) / 1000;
  const elecCost = kwh * e.ratePerKwh;
  const depPerHour = s.depreciationEnabled ? (p.purchasePrice - p.residualValue)/p.lifeHours : 0;
  const depCost = depPerHour * pricerState.hours;
  const laborCost = s.laborEnabled ? s.laborRatePerHour * pricerState.hours : 0;
  const other = pricerState.otherCosts;
  const realCost = filCost + elecCost + depCost + laborCost + other;
  const costPerPiece = realCost / Math.max(pricerState.pieces,1);
  const price = costPerPiece * (1 + pricerState.margin/100);
  const profit = price - costPerPiece;
  return `<div class="panel"><h2>Desglose de costo (por pieza, ${pricerState.pieces} pza)</h2>
    <div class="calcline"><span>Filamento (con ${s.wastePercent}% desperdicio)</span><span>${money(filCost)}</span></div>
    <div class="calcline"><span>Electricidad (${kwh.toFixed(3)} kWh × ${e.ratePerKwh})</span><span>${money(elecCost)}</span></div>
    <div class="calcline"><span>Depreciación ${s.depreciationEnabled?'':'(desactivada)'}</span><span>${money(depCost)}</span></div>
    <div class="calcline"><span>Mano de obra ${s.laborEnabled?'':'(desactivada)'}</span><span>${money(laborCost)}</span></div>
    <div class="calcline"><span>Otros costos</span><span>${money(other)}</span></div>
    <div class="calcline total"><span>Costo real total (lote)</span><span>${money(realCost)}</span></div>
    <div class="calcline"><span>Costo real por pieza</span><span>${money(costPerPiece)}</span></div>
    <div class="calcline"><span>Margen aplicado</span><span>${pricerState.margin}%</span></div>
    <div class="calcline total" style="color:var(--accent2)"><span>Precio de venta sugerido</span><span>${money(price)}</span></div>
    <div class="calcline"><span>Ganancia por pieza</span><span>${money(profit)}</span></div>
  </div>`;
}

function viewCatalog(){
  return `<h1>Catálogo PDF</h1><div class="sub">Genera un catálogo comercial, agrupado por temporada y categoría, con fotos.</div>
  <div class="panel"><h2>Generar</h2>
  <div class="hint" style="margin-bottom:12px">Se incluyen todos los productos con precio asignado. Los agrupados sin temporada aparecen en "General".</div>
  <button class="btn" onclick="generateCatalogPDF()">Generar catálogo PDF (${DB.products.filter(p=>p.price>0).length} productos)</button>
  </div>`;
}
function generateCatalogPDF(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:"pt", format:"a4"});
  const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
  const biz = DB.settings.business;
  const hexToRgb = hex=>{ const h=hex.replace('#',''); return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)]; };
  // Portada
  doc.setFillColor(20,20,30); doc.rect(0,0,W,H,"F");
  doc.setTextColor(255,255,255); doc.setFontSize(30); doc.text(biz.name||"Catálogo", W/2, H/2-20, {align:"center"});
  doc.setFontSize(12); doc.text(biz.whatsapp?("WhatsApp: "+biz.whatsapp):"", W/2, H/2+14, {align:"center"});
  const grouped = {};
  DB.products.filter(p=>p.price>0).forEach(p=>{
    const season = p.season || "General";
    grouped[season] = grouped[season] || {};
    grouped[season][p.category] = grouped[season][p.category] || [];
    grouped[season][p.category].push(p);
  });
  Object.keys(grouped).forEach(season=>{
    const seasonObj = DB.seasons.find(s=>s.name===season);
    const [r,g,b] = seasonObj ? hexToRgb(seasonObj.color) : [30,34,41];
    // Separador de temporada con su propio color/estética
    doc.addPage(); doc.setFillColor(r,g,b); doc.rect(0,0,W,H,"F");
    doc.setFillColor(255,255,255); doc.rect(40,H/2-2,W-80,4,"F");
    doc.setTextColor(255,255,255); doc.setFontSize(30); doc.text(season, W/2, H/2-30, {align:"center"});
    doc.setFontSize(11); doc.text(biz.name||"", W/2, H/2+40, {align:"center"});
    let y = 100;
    Object.keys(grouped[season]).forEach(cat=>{
      if(y>H-100){ doc.addPage(); doc.setFillColor(255,255,255); doc.rect(0,0,W,H,"F"); y=60; }
      else { doc.setFillColor(255,255,255); doc.rect(0,0,W,H,"F"); }
      doc.setFillColor(r,g,b); doc.rect(40,y-16,26,4,"F");
      doc.setTextColor(50,50,50); doc.setFontSize(15); doc.text(cat, 74, y); y+=20;
      let x = 40, colW=(W-80)/3, cardH=150, col=0;
      grouped[season][cat].forEach(p=>{
        if(y+cardH>H-40){ doc.addPage(); doc.setFillColor(255,255,255); doc.rect(0,0,W,H,"F"); y=60; x=40; col=0; }
        try{ if(p.photos&&p.photos[0]) doc.addImage(p.photos[0], x, y, colW-10, 100); }catch(e){}
        doc.setDrawColor(r,g,b); doc.setLineWidth(1.2); doc.rect(x, y, colW-10, cardH);
        doc.setFontSize(11); doc.setTextColor(20,20,20); doc.text(p.name, x+5, y+115, {maxWidth:colW-20});
        doc.setFontSize(12); doc.setTextColor(r,g,b); doc.text(money(p.price), x+5, y+135);
        col++; x += colW;
        if(col>=3){ col=0; x=40; y+=cardH+15; }
      });
      y += cardH+30;
    });
  });
  doc.save("catalogo-"+today()+".pdf");
}

/* ============ RESPALDO JSON ============ */
async function sbReplaceCollection(collection, items){
  const {error:delErr} = await supa.from("app_records").delete().eq("collection",collection).eq("user_id",userId);
  if(delErr) throw delErr;
  if(items && items.length){
    const rows = items.map(it=>{ const clean={...it}; delete clean.id; return {collection, payload:clean, user_id:userId}; });
    const {error:insErr} = await supa.from("app_records").insert(rows);
    if(insErr) throw insErr;
  }
}
function exportBackup(){
  const blob = new Blob([JSON.stringify({backupVersion:1, exportedAt:new Date().toISOString(), data:DB}, null, 2)], {type:"application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "respaldo-3dbm-"+today()+".json"; a.click();
}
function importBackup(input){
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = async e=>{
    try{
      const parsed = JSON.parse(e.target.result);
      if(!parsed.backupVersion || !parsed.data) throw new Error("formato inválido");
      if(!confirm("¿Reemplazar todos los datos EN LA NUBE con este respaldo? Esta acción no se puede deshacer.")) return;
      const d = parsed.data;
      await saveConfig({settings:d.settings, printers:d.printers, electricity:d.electricity, categories:d.categories, seasons:d.seasons});
      const collections = ["filaments","products","packages","customers","sales","quotes","purchases","expenses","maintenance","inventoryMovements","printJobs"];
      for(const c of collections){ await sbReplaceCollection(c, d[c]||[]); }
      alert("Respaldo restaurado. Recargando...");
      await initApp();
    }catch(err){ alert("No se pudo restaurar el respaldo: "+err.message); }
  };
  reader.readAsText(file);
}

/* ============ ESTADÍSTICAS ============ */
function bar(label, value, max){
  const pct = max>0 ? Math.round((value/max)*100) : 0;
  return `<div style="margin-bottom:10px"><div class="calcline" style="border:none;padding:2px 0"><span>${label}</span><span>${money(value)}</span></div>
  <div style="height:8px;background:var(--panel2);border-radius:4px"><div style="height:8px;width:${pct}%;background:var(--accent);border-radius:4px"></div></div></div>`;
}
function viewStats(){
  const byMonth = {};
  DB.sales.forEach(s=>{ const m=s.createdAt.slice(0,7); byMonth[m]=byMonth[m]||{ventas:0,costo:0}; byMonth[m].ventas+=s.total; byMonth[m].costo+=s.cost; });
  const months = Object.keys(byMonth).sort().slice(-6);
  const maxVenta = Math.max(...months.map(m=>byMonth[m].ventas),1);
  const prodCount = {};
  DB.sales.forEach(s=>{ prodCount[s.productName]=(prodCount[s.productName]||0)+s.qty; });
  const topProducts = Object.entries(prodCount).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const custTotal = {};
  DB.sales.forEach(s=>{ custTotal[s.customerId]=(custTotal[s.customerId]||0)+s.total; });
  const topCust = Object.entries(custTotal).sort((a,b)=>b[1]-a[1]).slice(0,5)
    .map(([id,t])=>[DB.customers.find(c=>c.id===id)?.name||'—', t]);
  const totalProfit = DB.sales.reduce((a,s)=>a+s.profit,0);
  const split = DB.settings.profitSplit;
  return `<h1>Estadísticas</h1><div class="sub">Ordenado por métricas objetivas (monto, cantidad).</div>
  <div class="panel"><h2>Ventas por mes (últimos ${months.length||0})</h2>
  ${months.map(m=>bar(m, byMonth[m].ventas, maxVenta)).join("") || '<div class="hint">Aún no hay ventas.</div>'}</div>
  <div class="panel"><h2>Productos más vendidos (por piezas)</h2>
  ${topProducts.map(([n,q])=>`<div class="calcline"><span>${n}</span><span>${q} pza</span></div>`).join("")||'<div class="hint">Sin datos.</div>'}</div>
  <div class="panel"><h2>Clientes por monto total</h2>
  ${topCust.map(([n,t])=>`<div class="calcline"><span>${n}</span><span>${money(t)}</span></div>`).join("")||'<div class="hint">Sin datos.</div>'}</div>
  <div class="panel"><h2>Distribución de ganancia acumulada</h2>
  <div class="calcline"><span>Ganancia total</span><span>${money(totalProfit)}</span></div>
  <div class="calcline"><span>Reinversión (${split.reinvest}%)</span><span>${money(totalProfit*split.reinvest/100)}</span></div>
  <div class="calcline"><span>Mantenimiento (${split.maintenance}%)</span><span>${money(totalProfit*split.maintenance/100)}</span></div>
  <div class="calcline total"><span>Ganancia neta (${split.profit}%)</span><span>${money(totalProfit*split.profit/100)}</span></div></div>`;
}

/* ============ BUSCADOR GLOBAL ============ */
function globalSearch(q){
  q = q.toLowerCase().trim(); if(!q) return [];
  const res = [];
  DB.products.forEach(p=>{ if(p.name.toLowerCase().includes(q)) res.push({type:"Producto", label:p.name, go:"products"}); });
  DB.customers.forEach(c=>{ if(c.name.toLowerCase().includes(q)) res.push({type:"Cliente", label:c.name, go:"customers"}); });
  DB.filaments.forEach(f=>{ if((f.colorName+f.brand+f.type).toLowerCase().includes(q)) res.push({type:"Filamento", label:f.colorName+" — "+f.brand, go:"filaments"}); });
  DB.packages.forEach(p=>{ if(p.name.toLowerCase().includes(q)) res.push({type:"Paquete", label:p.name, go:"packages"}); });
  return res.slice(0,8);
}
function doGlobalSearch(q){
  const results = globalSearch(q);
  const box = document.getElementById("searchResults");
  if(!box) return;
  box.innerHTML = results.map(r=>`<div class="calcline" style="cursor:pointer" onclick="go('${r.go}')"><span>${r.label}</span><span class="pill">${r.type}</span></div>`).join("") || (q?'<div class="hint">Sin resultados.</div>':'');
}

/* ============ INVENTARIO (movimientos) ============ */
function viewInventory(){
  const rows = [...DB.inventoryMovements].reverse().slice(0,100).map(m=>`<tr><td>${m.date}</td><td>${m.productName}</td>
    <td><span class="pill" style="border-color:${m.type==='Entrada'?'var(--accent2)':'var(--danger)'}">${m.type}</span></td>
    <td>${m.qty}</td><td>${m.reason}</td><td>${m.stockBefore} → ${m.stockAfter}</td></tr>`).join("");
  const low = DB.products.filter(p=>p.stock<=5);
  return `<h1>Inventario</h1><div class="sub">Movimientos automáticos (ventas) y manuales (ajustes de stock).</div>
  <div class="panel"><h2>Alertas de stock bajo (≤5)</h2>
  ${low.map(p=>`<div class="calcline"><span>${p.name}</span><span style="color:var(--warn)">${p.stock} unidades</span></div>`).join("")||'<div class="hint">Todo el stock está bien.</div>'}</div>
  <div class="panel"><h2>Historial de movimientos (últimos 100)</h2>
  <table><thead><tr><th>Fecha</th><th>Producto</th><th>Tipo</th><th>Cant.</th><th>Motivo</th><th>Stock</th></tr></thead>
  <tbody>${rows||'<tr><td colspan="6" class="hint">Sin movimientos aún.</td></tr>'}</tbody></table></div>`;
}

/* ============ IMPRESIONES (trabajos de producción) ============ */
function viewPrintJobs(){
  const rows = [...DB.printJobs].reverse().map(j=>{
    const prod = DB.products.find(p=>p.id===j.productId);
    return `<tr><td>${j.date}</td><td>${prod?prod.name:'—'}</td><td>${j.grams} g</td><td>${j.hours} h</td>
    <td>${money(j.electricityCost)}</td><td>${money(j.depreciationCost)}</td><td>${money(j.totalCost)}</td>
    <td><button class="btn small secondary" onclick="delPrintJob('${j.id}')">Eliminar</button></td></tr>`;
  }).join("");
  const totalGrams = DB.printJobs.reduce((a,j)=>a+j.grams,0), totalHours = DB.printJobs.reduce((a,j)=>a+j.hours,0);
  return `<h1>Impresiones</h1><div class="sub">Registro de cada trabajo de producción — alimenta las estadísticas y las horas acumuladas de la impresora.</div>
  <div class="grid">
    <div class="card kpi"><div class="label">Gramos totales</div><div class="val">${totalGrams} g</div></div>
    <div class="card kpi"><div class="label">Horas totales</div><div class="val">${totalHours.toFixed(1)} h</div></div>
  </div>
  <div class="panel"><h2>Registrar trabajo de impresión</h2><div class="row">
    <div class="field"><label>Producto</label><select id="jProd"><option value="">Selecciona…</option>${DB.products.map(p=>`<option value="${p.id}">${p.name}</option>`).join("")}</select></div>
    <div class="field"><label>Gramos usados</label><input id="jGrams" type="number"></div>
    <div class="field"><label>Horas</label><input id="jHours" type="number" step="0.1"></div>
  </div><button class="btn" onclick="addPrintJob()">Registrar</button>
  <div class="hint">El costo eléctrico y la depreciación se calculan y se guardan con la tarifa/config de hoy (snapshot histórico); si luego cambias la tarifa, este registro no se altera.</div></div>
  <div class="panel"><h2>Historial</h2>
  <table><thead><tr><th>Fecha</th><th>Producto</th><th>Gramos</th><th>Horas</th><th>Electricidad</th><th>Depreciación</th><th>Costo total</th><th></th></tr></thead>
  <tbody>${rows||'<tr><td colspan="8" class="hint">Sin registros aún.</td></tr>'}</tbody></table></div>`;
}
async function addPrintJob(){
  const prodId = val("jProd"), grams = parseFloat(val("jGrams"))||0, hours = parseFloat(val("jHours"))||0;
  if(!prodId || (!grams && !hours)){ alert("Selecciona un producto y captura gramos u horas."); return; }
  await repo.printJobs.add({productId:prodId, grams, hours});
  render();
}
async function delPrintJob(id){ await repo.printJobs.remove(id); render(); }
async function markPurchaseBought(id){ await repo.purchases.setStatus(id, "Comprado"); render(); }
async function convertQuote(id){ await repo.quotes.convertToSale(id); render(); }

/* ============ ROUTER ============ */
function render(){
  renderNav();
  const main = document.getElementById("main");
  const active = document.activeElement;
  const focusInfo = (active && active.id && main.contains(active)) ? {id:active.id, start:active.selectionStart, end:active.selectionEnd} : null;
  if(!userId){
    main.innerHTML = viewAuth();
    restoreFocus(focusInfo);
    return;
  }
  const views = {dashboard:viewDashboard, pricer:viewPricer, filaments:viewFilaments, products:viewProducts,
    inventory:viewInventory, printjobs:viewPrintJobs, catalog:viewCatalog, packages:viewPackages, customers:viewCustomers, sales:viewSales, expenses:viewExpenses,
    purchases:viewPurchases, categories:viewCategories, quotes:viewQuotes, maintenance:viewMaintenance,
    stats:viewStats, printers:viewPrinters, settings:viewSettings};
  main.innerHTML = `<div class="row" style="margin-bottom:16px;position:relative">
    <div class="field" style="max-width:320px;margin:0">
      <input placeholder="Buscar productos, clientes, filamentos, paquetes…" oninput="doGlobalSearch(this.value)">
      <div id="searchResults" style="position:absolute;z-index:5;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:6px 10px;width:100%;max-width:320px"></div>
    </div>
  </div>
  ${connError?`<div class="panel" style="border-color:var(--danger)"><b style="color:var(--danger)">⚠ Sin conexión a la nube:</b> ${connError}. Revisa tu internet o recarga la página; mientras tanto los cambios no se pueden guardar.</div>`:''}
  ` + views[currentRoute]();
  restoreFocus(focusInfo);
}
function restoreFocus(info){
  if(!info) return;
  const el = document.getElementById(info.id);
  if(el){ el.focus(); if(typeof info.start==="number" && el.setSelectionRange){ try{ el.setSelectionRange(info.start, info.end); }catch(e){} } }
}
initApp();
document.getElementById("main").innerHTML = '<div class="hint">Conectando con la nube…</div>';
</script>
</body>
